name: CI

# Se ejecuta en cada Pull Request y en cada actualización de la rama principal
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (instalación limpia)
        run: npm ci

      - name: Validar sintaxis (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Compilar el proyecto
        run: npm run build

  backend:
    name: Backend (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sgci
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: clave-solo-para-ci
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      PGPASSWORD: postgres
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Instalar dependencias
        working-directory: Backend
        run: pip install -r requirements.txt

      - name: Crear el esquema y los datos de prueba
        run: |
          psql -h localhost -U postgres -d sgci -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -h localhost -U postgres -d sgci -v ON_ERROR_STOP=1 -f database/data_prueba.sql

      - name: Ejecutar las pruebas
        working-directory: Backend
        run: python -m pytest tests -v
